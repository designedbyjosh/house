name: Website checks and deployment
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: house-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install from the lockfile without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax, security and content tests
        run: |
          npm run check
          node scripts/security-check.mjs
          npm test
          python3 -m py_compile scripts/deploy.py
      - name: Build without backend credentials or network calls
        run: npm run build
        env:
          SITE_URL: https://josh.engineer
      - name: Verify every local link and recovered article
        run: npm run verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: website-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: javascript-typescript,python
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [verify, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Reproduce the verified static build
        run: npm run build
        env:
          SITE_URL: https://josh.engineer
      - name: Get temporary credentials for this repository and branch
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::347069581928:role/house-github-deploy
          aws-region: ap-southeast-2
          allowed-account-ids: '347069581928'
          role-session-name: house-${{ github.run_id }}
      - name: Validate the infrastructure template against AWS
        run: aws cloudformation validate-template --template-body file://infra/site.json --region ap-southeast-2
      - name: Publish and verify the immutable release
        run: python3 scripts/deploy.py --release "$GITHUB_SHA"
