name: Roll back the website
on:
  workflow_dispatch:
    inputs:
      release:
        description: Full Git commit SHA of a previously deployed release
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: house-Website checks and deployment-refs/heads/master
  cancel-in-progress: false
jobs:
  rollback:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::347069581928:role/house-github-deploy
          aws-region: ap-southeast-2
          allowed-account-ids: '347069581928'
      - name: Restore an existing release and verify it
        run: python3 scripts/deploy.py --release "$RELEASE" --rollback
        env:
          RELEASE: ${{ inputs.release }}
